


<div class="dashboard-container">

  <h2 class="dashboard-title">📊 Dashboard</h2>

  <div class="card-grid">
    <mat-card class="summary-card total-expense">
      <mat-card-title>Total Expenses</mat-card-title>
      <mat-card-content>₹{{ totalExpenses }}</mat-card-content>
    </mat-card>

    <mat-card class="summary-card monthly-expense">
      <mat-card-title>This Month</mat-card-title>
      <mat-card-content>₹{{ monthlyExpense }}</mat-card-content>
    </mat-card>

    <mat-card class="summary-card top-category">
      <mat-card-title>Top Category</mat-card-title>
      <mat-card-content>{{ topCategory }}</mat-card-content>
    </mat-card>
  </div>

  <!-- Optional Chart Placeholder -->
  <!-- <app-expense-chart></app-expense-chart> -->

</div>
