
<div class="table-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 expense-table">
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let expense"> {{expense.id}} </td>
    </ng-container>
    
    <ng-container matColumnDef="Expense Name">
        <th mat-header-cell *matHeaderCellDef> Expense Name </th>
        <td mat-cell *matCellDef="let expense"> {{expense.expenseName}} </td>
    </ng-container>
    
    <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef> Amount </th>
        <td mat-cell *matCellDef="let expense"> {{expense.expenseAmount | currency}} </td>
    </ng-container>
    
    <ng-container matColumnDef="mainCategory">
      <th mat-header-cell *matHeaderCellDef>Main Category</th>
      <td mat-cell *matCellDef="let expense">{{ expense.mainCategory }}</td>
    </ng-container>

    <ng-container matColumnDef="subCategory">
      <th mat-header-cell *matHeaderCellDef>Sub Category</th>
      <td mat-cell *matCellDef="let expense">{{ expense.subCategory }}</td>
    </ng-container>

    
    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Date </th>
        <td mat-cell *matCellDef="let expense"> {{expense.expenseDate | date}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let expense">
      <button mat-icon-button color="primary" (click)="editExpense(expense.expenseId!)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteExpense(expense.expenseId!)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>
    
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <button
  mat-fab
  color="primary"
  class="add-expense-fab"
  (click)="openAddExpenseDialog()">
  <mat-icon>add</mat-icon>
</button>

  <mat-paginator class="mat-paginator"
    [length]="totalRecords"
    [pageSize]="5"
    [pageSizeOptions]="[5, 10, 20, 50, 100]"
    showFirstLastButtons>
  </mat-paginator>
</div>
